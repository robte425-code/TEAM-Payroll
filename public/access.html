<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access management — TEAM Payroll</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/voc-shell.css" />
    <link rel="stylesheet" href="./css/app.css" />
  </head>
  <body class="voc-page">
    <div id="team-shell-root"></div>
    <script src="./js/team-shell.js"></script>
    <script>
      TeamShell.mount({
        mode: "admin",
        adminPage: "access",
        enableViewAs: true,
        onViewAsChange: () => window.location.assign("./my-leave.html"),
      });
    </script>

    <main class="voc-main">
      <h1 class="voc-page-title">Access management</h1>
      <p class="voc-page-lead">
        Payroll sign-in and admin access is managed centrally in Updates.
      </p>
      <div class="voc-card" style="max-width: 42rem">
        <p style="margin: 0 0 1rem; font-size: 0.875rem; color: #57534e">
          Open
          <a href="https://teamvoc-updates.vercel.app/manage/access" style="font-weight: 600; color: #1c1917"
            >Access &amp; admins</a
          >
          on the Updates site to manage who can sign in to Payroll and who has admin access.
        </p>
      </div>
    </main>
  </body>
</html>
